[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
# UV specific configurations can go here if needed
# For example:
# python = "3.11"
# resolver = "default"

[tool.mypy]
# MyPy configurations
# For example:
# disallow_untyped_defs = true
# no_implicit_optional = true
# warn_return_any = true
# warn_unused_ignores = true

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py311"
# select = [
#     "E",  # Error
#     "W",  # Warning
#     "F",  # Pyflakes
#     "I",  # Isort
#     "C",  # Complexity
#     "B",  # Bugbear
#     "UP", # Pyupgrade
#     "A",  # Builtin names
#     "D",  # Pydocstyle (optional, adjust to your preference)
# ]
# ignore = [
#     "E501", # Line too long (let ruff format handle this)
#     "D100", # Missing docstring in public module
#     "D104", # Missing docstring in public package
#     "D105", # Missing docstring in public function
#     "D107", # Missing docstring in __init__
# ]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Like Black, automatically detect the appropriate line ending. default: auto
line-ending = "lf"

# [project.scripts]
# start = "uvicorn app.main:app --host 0.0.0.0 --port 8000" # A convenient way to start for development

[tool.pytest.ini_options]
# required_plugins = pytest-django>=3.0.0,<4.0.0 pytest-html pytest-xdist>=1.0.0
# exclude = ["appliances/func_tests.py"]
testpaths = ["accounts", "appliances", "rules", "scirius", "suricata", "volumetry"]
# it should have been "tests.py test_*.py tests_*.py *_tests.py" but not all test can run with pytest so we are
# identifying them
python_files = "pytest.py pytests.py pytest_*.py"
usefixtures = ["django_db_setup"]  # to create the DB automatically without using fixture

# asyncio_mode = "auto" # Or "strict" for explicit markers
asyncio_default_fixture_loop_scope = "class"  # function | session | class
addopts = [
    "--create-db",
    # "--no-migrations",           # avoid migration run
    # "--nomigrations",            # alternative to --no-migrations
    # "--reuse-db",                # reuse DB between runs
    "--cov=scirius",             # Coverage of scirius package
    "--cov=suricata",
    "--cov=rules",
    "--cov=appliances",
    "--cov=volumetry",
    "--cov-report=html",         # HTML report
    "--cov-report=term-missing", # display missing lines in the terminal
    "--strict-markers",          # error if unknown marker
    "--tb=short",                # shorter Traceback
    "-v",                        # verbose mode
]
cache_dir = "/tmp/.pytest-scirius"

DJANGO_SETTINGS_MODULE = "tests.settings"

django_find_project = true

markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "db: marks tests that require database access",
    "no_db: marks tests that don't need database",
]

filterwarnings = [
    # "ignore::django.utils.deprecation.RemovedInDjango50Warning",
    # "ignore::django.utils.deprecation.RemovedInDjango51Warning",
    "ignore::DeprecationWarning:django.*",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
# Whether to measure branch coverage in addition to statement coverage.
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/tests.py",
    "*/pytest_*.py",
    "*/pytests.py",
    "*/conftest.py",
    "*/migrations/*",
    "*/venv/*",
    "*/env/*",
    "manage.py",
    "*/settings/*",
    "*/wsgi.py",
    "*/asgi.py",
]
# concurrency = "multiprocessing"
# concurrency = "gevent"
parallel = true
sigterm = true

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
    # Don't complain about missing debug-only code:
    "def __repr__",
    "if self\\.debug",

    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",

    # Don't complain if non-runnable code isn't run:
    "if 0:",
    "if __name__ == .__main__.:",

    # Don't complain about abstract methods, they aren't run:
    "@(abc\\.)?abstractmethod",
]

ignore_errors = true
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "coverage_html_report"

[tool.coverage.xml]
output = "coverage.xml"
